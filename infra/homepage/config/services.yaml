---
# Infrastructure
- Infrastructure:
    - Proxmox:
        href: https://192.168.1.180:8006
        description: Virtualization platform hosting the Kubernetes cluster
        icon: proxmox.png
        widget:
          type: proxmox
          url: https://192.168.1.180:8006
          username: ${PROXMOX_USERNAME}
          password: ${PROXMOX_API_TOKEN}
          allowInsecure: true
    - TrueNAS:
        href: https://192.168.1.127
        siteMonitor: https://192.168.1.127
        description: Storage server for TrueNAS
        icon: truenas.png
        widget:
          type: truenas
          url: https://192.168.1.127
          enablePools: true
          key: ${TRUENAS_API_KEY}
          allowInsecure: true
    - Pi-hole:
        href: http://192.168.1.3/admin
        description: Network-wide ad blocking and DNS server
        icon: pi-hole.png
        widget:
          type: pihole
          url: http://192.168.1.3
          key: ${PIHOLE_API_KEY}
    - Home Assistant:
        href: http://192.168.1.2:8123
        description: Home automation platform
        icon: home-assistant.png
        widget:
          type: homeassistant
          url: http://192.168.1.2:8123
          key: ${HOMEASSISTANT_TOKEN}
        siteMonitor: http://192.168.1.2:8123
    - MinIO:
        href: http://minio.minio.svc.cluster.local:9000
        description: Object storage for Loki and Mimir
        icon: minio.png
        siteMonitor: http://minio.minio.svc.cluster.local:9000/minio/health/ready

    - Longhorn:
        href: http://192.168.1.34/#/dashboard
        description: Distributed block storage for Kubernetes
        icon: longhorn.png
        siteMonitor: http://192.168.1.34/v1/nodes

    - MetalLB:
        description: Bare metal load balancer for Kubernetes
        icon: metallb.png

    - Istio:
        description: Service mesh for Kubernetes
        icon: istio.png

    - Metrics Server:
        description: Kubernetes metrics API
        icon: kubernetes.png

    - Raspberry Pi (Wall Display):
        href: http://192.168.1.214
        description: Powers Home Assistant wall display and hosts Zigbee2MQTT
        icon: raspberry-pi.png
        ping: 192.168.1.214

    - Tailscale:
        description: VPN subnet router for remote access
        icon: tailscale.png
        widget:
            type: tailscale
            deviceid: ${TAILSCALE_DEVICE_ID}
            key: ${TAILSCALE_API_KEY}
# Networking & Security
- Networking & Security:
    - UniFi Controller:
        href: https://192.168.1.29:8443
        description: Network controller for UniFi devices
        icon: unifi.png
        widget:
          type: unifi
          url: https://192.168.1.29:8443
          username: ${UNIFI_USERNAME}
          password: ${UNIFI_PASSWORD}
# Databases
- Databases:
    - PostgreSQL (CloudNativePG):
        href: postgresql://192.168.1.48:5432/homeassistant
        description: PostgreSQL cluster for Home Assistant
        icon: postgres.png
        ping: tcp://192.168.1.48:5432

    - InfluxDB:
        href: http://influxdb.home-automation.svc.cluster.local:8086
        description: Time series database
        icon: influxdb.png
        ping: http://influxdb.home-automation.svc.cluster.local:8086/ping
# Monitoring & Observability
- Monitoring & Observability:
    - Grafana:
        href: http://192.168.1.35
        description: Metrics visualization and dashboards
        icon: grafana.png
        widget:
          type: grafana
          url: http://192.168.1.35
          username: ${GRAFANA_USERNAME}
          password: ${GRAFANA_PASSWORD}

    - Loki:
        href: http://loki-gateway.loki.svc.cluster.local
        description: Log aggregation system
        icon: loki.png
        siteMonitor: http://loki-gateway.loki.svc.cluster.local/loki/api/v1/labels?start=1766737021615000000&end=1766740621615000000

    - Mimir:
        href: http://mimir-nginx.mimir.svc.cluster.local
        description: Prometheus-compatible metrics backend
        icon: mimir.png
        siteMonitor: http://mimir-nginx.mimir.svc.cluster.local/prometheus/api/v1/status/buildinfo

    - Alloy:
        href: http://192.168.1.39
        description: Metrics and logs collector
        icon: grafana.png
        siteMonitor: http://alloy.grafana-alloy.svc.cluster.local:12345/-/ready
