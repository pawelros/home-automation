---
- logo:
    icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/home-assistant.png

- search:
    provider: duckduckgo
    target: _blank

- greeting:
    text_size: xl
    text: "Welcome to HomeLab!"

- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: "Homelab Cluster"
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true

- resources:
    backend: kubernetes
    expanded: true
    cpu: true
    memory: true

- longhorn:
    expanded: true
    total: true
    labels: true
    nodes: true

